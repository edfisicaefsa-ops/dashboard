<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Gestión Académica · EFSA</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- BLOQUEO GLOBAL DURANTE OPERACIONES API -->
  <div id="global-blocker" class="global-blocker hidden" aria-hidden="true">
    <div class="blocker-box">
      <div class="spinner"></div>
      <div id="global-blocker-text">Procesando solicitud...</div>
    </div>
  </div>

  <!-- PANTALLA DE LOGIN -->
  <section id="login-view" class="login-wrapper">
    <div class="card login-card stack-md">
      <div class="login-brand">
        <img id="login-escudo" class="login-escudo hidden" alt="Escudo institucional" />
        <div id="login-instituto" class="login-instituto">Escuela de Suboficiales</div>
        <div class="item-meta" style="text-align:center;">Sistema de Gestión Académica</div>
      </div>

      <form id="login-form" class="stack-md">
        <div class="field">
          <label for="login-usuario">Usuario</label>
          <input id="login-usuario" name="usuario" type="text" autocomplete="username" required placeholder="Tu usuario" />
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Tu contraseña" />
        </div>
        <button id="btn-login" type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </form>

      <div style="text-align:center;">
        <button id="btn-forgot-password" type="button" class="btn-link">¿Olvidaste tu contraseña?</button>
      </div>
    </div>
  </section>

  <!-- SHELL PRINCIPAL -->
  <div id="app-shell" class="app-shell hidden">
    <!-- PRIMER BLOQUE SUPERIOR: ESCUDO, INSTITUCIÓN, USUARIO Y ACCIONES -->
    <header class="topbar">
      <div class="topbar-brand">
        <img id="topbar-escudo" class="topbar-escudo hidden" alt="Escudo" />
        <div class="topbar-info">
          <div id="topbar-instituto" class="topbar-instituto">Escuela de Suboficiales</div>
          <div id="topbar-user" class="topbar-meta"></div>
        </div>
      </div>
      <div class="row-gap">
        <button id="btn-change-password" type="button" class="btn btn-secondary btn-sm hidden">Cambiar contraseña</button>
        <button id="btn-logout" type="button" class="btn btn-danger btn-sm">Salir</button>
      </div>
    </header>

    <div id="lock-banner" class="lock-banner hidden">
      La plataforma se encuentra cerrada para la carga de calificaciones por parte de profesores.
    </div>

    <main id="main-content" class="main-content"></main>

    <nav id="admin-nav" class="bottom-nav hidden"></nav>
    <nav id="prof-nav" class="bottom-nav hidden"></nav>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div id="modal-card" class="modal-card stack-md" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div id="modal-title" class="card-title" style="margin:0"></div>
        <button id="btn-close-modal" type="button" class="btn btn-secondary btn-sm">Cerrar</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
